[package]
name = "torched"
version = "0.5.0"
edition = "2024"
description = "Artillery on destructible ground in the terminal, after Xscorch"
license = "GPL-2.0-only"

[dependencies]
ratatui = "0.30"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
gilrs = "0.11"

[profile.release]
lto = true
